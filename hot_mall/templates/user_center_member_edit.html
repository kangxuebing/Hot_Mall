{% extends 'base.html' %}
{% block title %}肥猫商城-编辑会员信息{% endblock %}

{% block extra_css %}
<style>
    [v-cloak] { display: block !important; }
</style>
{% endblock %}

{% block right_content %}
    <h3 class="common_title2" style="text-align:center; margin-bottom:20px; color:#222; font-weight:bold;">
        {{ title }}</h3>

    <div class="card shadow-sm" style="border-radius:10px; border:none; background:#fff; max-width:800px; margin:0 auto;">
        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="">
                <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="id_username" class="form-label">用户名</label>
                        <input type="text" class="form-control" id="id_username" value="{{ object.username }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label for="id_mobile" class="form-label">手机号</label>
                        <input type="text" class="form-control" id="id_mobile" value="{{ object.mobile }}" readonly>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="id_email" class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="id_email" value="{{ object.email }}" readonly>
                    </div>
                    <div class="col-md-6">
                        <label for="id_total_consume" class="form-label">累计消费</label>
                        <input type="text" class="form-control" id="id_total_consume" value="{{ object.total_consume }}" readonly>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="id_member_level" class="form-label">会员等级</label>
                    <select class="form-select" id="id_member_level" name="member_level">
                        <option value="0" {% if object.member_level == 0 %}selected{% endif %}>普通会员</option>
                        <option value="1" {% if object.member_level == 1 %}selected{% endif %}>银卡会员</option>
                        <option value="2" {% if object.member_level == 2 %}selected{% endif %}>金卡会员</option>
                        <option value="3" {% if object.member_level == 3 %}selected{% endif %}>钻石会员</option>
                    </select>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="id_points" class="form-label">积分</label>
                        <input type="number" class="form-control" id="id_points" name="points" value="{{ object.points }}" min="0">
                    </div>
                    <div class="col-md-6">
                        <label for="id_discount_rate" class="form-label">折扣率</label>
                        <input type="number" class="form-control" id="id_discount_rate" name="discount_rate"
                               value="{{ object.discount_rate }}" step="0.01" min="0.01" max="1.00">
                        <small class="text-muted">范围：0.01-1.00</small>
                    </div>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="{{ url('users:member_list') }}" class="btn btn-secondary">返回列表</a>
                    <button type="submit" class="btn btn-primary">保存修改</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
