{% extends 'base.html' %}
{% block title %}肥猫商城-{{ title }}{% endblock %}

<!-- 新增：隐藏base里的顶部全局搜索栏 -->
{% block extra_css %}
    {{ super() }}
{% endblock %}

{% block right_content %}
    <div class="container-fluid p-0">
        <h3 class="common_title2" style="text-align:center; margin-bottom:20px; color:#222; font-weight:bold;">
            {{ title }}
        </h3>
        <div class="card shadow-sm border-0" style="border-radius:10px; background:#fff;">
            <div class="card-body p-4">
                <form id="specOptionForm" method="post">
                    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

                    <div class="table-responsive mb-4">
                        <table class="table"
                               style="border-collapse:separate; border-spacing:0; font-size:14px; width:100%;">
                            <tbody>
                            <tr style="background-color:#fafbfc;">
                                <td style="width:120px; padding:12px; font-weight:500; color:#333;">规格 <span
                                        class="text-danger">*</span></td>
                                <td style="padding:12px;">
                                    <select name="spec" class="form-control">
                                        <option value="">请选择</option>
                                        {% for spec in specs %}
                                            <option value="{{ spec.id }}"
                                                    {% if form.instance.id and form.instance.spec.id == spec.id %}selected{% endif %}>{{ spec.name }}</option>
                                        {% endfor %}
                                    </select>
                                    <span class="text-danger" v-if="errors.spec">[[ errors.spec ]]</span>
                                </td>
                            </tr>
                            <tr style="background-color:#fafbfc;">
                                <td style="padding:12px; font-weight:500; color:#333;">选项值 <span class="text-danger">*</span>
                                </td>
                                <td style="padding:12px;">
                                    <input type="text" name="value" class="form-control" value="
                                            {% if form.instance.id %}{{ form.instance.value|default('') }}{% else %}{{ form.value.data|default('') }}{% endif %}">
                                    <span class="text-danger" v-if="errors.value">[[ errors.value ]]</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 16px; margin-top: 30px;">
                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <button type="button" onclick="location.href='{{ url('goods:specification_option_list') }}'"
                                    class="btn btn-outline-secondary">取消
                            </button>
                            <button type="button" @click="submitForm()" class="btn btn-primary">保存</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

{% endblock %}

{% block extra_js %}
    <style>
        :root {
            --primary-color: #0d6efd;
            --success-color: #198754;
            --danger-color: #dc3545;
            --light-bg: #f8f9fa;
            --border-color: #e9ecef;
        }
    </style>

    <script>
        window.csrfToken = '{{ csrf_token }}';
        window.currentSpecOptionId = '';
        // 仅编辑页有ID才读取外键，新增页禁止访问外键防报错
        {% if form.instance.id %}
            window.currentSpecOptionId = '{{ form.instance.id }}';
            window.SPEC_OPTION_DATA = {
                spec: "{{ form.instance.spec.id }}",
                value: "{{ form.instance.value|default('') }}"
            };
        {% else %}
            window.SPEC_OPTION_DATA = null;
        {% endif %}
    </script>

    <script src="/static/js/vue-2.5.16.js"></script>
    <script src="/static/js/specification_option_add.js"></script>
{% endblock %}
